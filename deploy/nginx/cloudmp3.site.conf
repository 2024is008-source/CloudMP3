# cloudmp3.site — Nginx vhost for the Contabo VPS, behind Cloudflare.
#
# Install:  sudo cp deploy/nginx/cloudmp3.site.conf         /etc/nginx/conf.d/
#           sudo cp deploy/nginx/snippet-cloudmp3-site.conf /etc/nginx/snippets/cloudmp3-site.conf
# then `sudo nginx -t` before `sudo systemctl reload nginx`. Existing vhosts are
# untouched: this file only claims the two cloudmp3.site names.
#
# Replace before first use:
#   /srv/cloudmp3                -> where the repository lives on the VPS
#   /etc/ssl/cloudmp3.site/*     -> where you installed the TLS certificate
#   3000                         -> must equal PORT in deploy/ecosystem.config.cjs
#
# Syntax note: `http2 on` needs nginx >= 1.25.5. On Ubuntu 22.04/24.04 (1.18/1.24)
# delete that line and use `listen 443 ssl http2;` instead.

# --- browser-facing scheme ---------------------------------------------------
# Cloudflare sets X-Forwarded-Proto. Trusting it is safe here because the origin
# is only reachable through Cloudflare's ranges (firewall below) — and it is what
# prevents an HTTP->HTTPS redirect loop when the SSL mode is "Flexible".
map $http_x_forwarded_proto $cloudmp3_scheme {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# --- real client IP ---------------------------------------------------------
# Without this, $binary_remote_addr is a shared Cloudflare edge address and every
# per-IP limit below throttles all visitors together. The set_real_ip_from list
# lives in snippet-cloudmp3-site.conf instead of here, so this vhost cannot change
# how any other site on the VPS resolves client IPs.

# --- limits -----------------------------------------------------------------
# The downloader runs 4-6 parallel /api/public/track requests per visitor, so the
# API budget is per burst, not per single request. Tighten only if abuse appears.
limit_req_zone $binary_remote_addr zone=cloudmp3_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cloudmp3_conn:10m;
# The zones above are http-context by necessity but are namespaced and only
# *applied* inside this site's locations. `limit_req_status`/`limit_conn_status`
# would change the reply code for every vhost on the box, so they are set in
# snippets/cloudmp3-site.conf (server context) instead.

# --- http: redirect, or serve when Cloudflare talks plain http (Flexible) ---
server {
    listen 80;
    listen [::]:80;
    server_name cloudmp3.site www.cloudmp3.site;

    # This block is not only a redirector: when Cloudflare reaches the origin over
    # plain HTTP with a browser-facing scheme of HTTPS, the request falls through to
    # the shared locations below and is served. Its replies need the same headers,
    # and 413/429 generated here never reach the app's routeRules.
    server_tokens off;
    include snippets/cloudmp3-headers.conf;

    if ($host = www.cloudmp3.site) {
        return 301 https://cloudmp3.site$request_uri;
    }
    if ($cloudmp3_scheme = http) {
        return 301 https://cloudmp3.site$request_uri;
    }

    include snippets/cloudmp3-site.conf;
}

# --- https: the only canonical surface --------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloudmp3.site www.cloudmp3.site;

    ssl_certificate     /etc/ssl/cloudmp3.site/cloudmp3.site.crt;
    ssl_certificate_key /etc/ssl/cloudmp3.site/cloudmp3.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # www is not canonical under any circumstance.
    if ($host = www.cloudmp3.site) {
        return 301 https://cloudmp3.site$request_uri;
    }

    server_tokens off;
    charset utf-8;

    # Nothing is uploaded to this app. A ZIP request is a JSON list of track ids
    # and the archive comes back as a response, so the default 1m body limit is
    # kept visible rather than raised; the app refuses a larger request itself.
    client_max_body_size 1m;
    client_body_timeout 30s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Text only: audio and ZIP responses never match these types.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Enable only once HTTPS is confirmed working end to end; see the note in
    # snippet-cloudmp3-headers.conf. Kept in one file so a location that declares
    # its own Cache-Control cannot lose these.
    include snippets/cloudmp3-headers.conf;

    access_log /var/log/nginx/cloudmp3.access.log;
    error_log  /var/log/nginx/cloudmp3.error.log warn;

    include snippets/cloudmp3-site.conf;
}
