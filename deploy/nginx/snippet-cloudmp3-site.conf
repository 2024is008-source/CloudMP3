# Shared location block for cloudmp3.site — included by the HTTP and HTTPS servers
# in cloudmp3.site.conf. Install at /etc/nginx/snippets/cloudmp3-site.conf.
#
# Replace /srv/cloudmp3 and 3000 to match the VPS paths and deploy/ecosystem.config.cjs.
#
# Deliberately few add_header lines: nginx replaces (rather than merges) the
# parent add_header set as soon as a location declares one of its own. The two
# static locations below are the only ones that add a header, so they each include
# snippets/cloudmp3-headers.conf to bring the security headers back with them.
# Buffering is switched with the proxy_buffering directive for the same reason.
# The same rule applies to proxy_set_header, so the proxy headers are declared
# once here at server level and no location below re-declares them.

# Overridable, and only applied inside this vhost: rate-limited replies get a
# real 429 instead of nginx's default 503.
limit_req_status 429;
limit_conn_status 429;

root /srv/cloudmp3/.output/public;

# Restore the visitor's real address from Cloudflare. Kept at server level, inside
# this vhost only, so no other site on the box changes behaviour. Ranges are
# published at https://www.cloudflare.com/ips/ — re-check them before enabling.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- proxy headers, inherited by every location below -----------------------
# The app ignores Host and forwarded headers for canonical output (they come from
# the build-time VITE_SITE_ORIGIN), so a spoofed host cannot poison a canonical;
# these are for correct routing, logs and cookies. Cloudflare's own headers
# (CF-Connecting-IP, CF-Ray, CF-IPCountry) pass through untouched — only accept
# them from the ranges above.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $cloudmp3_scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";

# Dotfiles and backups must not be served.
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# Hashed client bundles: filename changes with content, so cache hard.
# No gzip_static: the build emits no .gz siblings, so it would never match.
location /assets/ {
    include snippets/cloudmp3-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Icons and social card — stable filenames, modest TTL.
location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|og/) {
    include snippets/cloudmp3-headers.conf;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri @cloudmp3_app;
}

# Audio downloads: the response is a live stream of SoundCloud segments and has
# no Content-Length. Buffering it to disk would stall the transfer and fill the
# VPS, so it is passed through as it arrives. Timeouts cover a full playlist
# (each request is one track; the client runs 4-6 of them at once).
location /api/public/track {
    limit_req zone=cloudmp3_api burst=40 nodelay;
    limit_conn cloudmp3_conn 24;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    tcp_nodelay on;
}

# Playlist ZIP: the service builds the whole archive on disk before the first
# byte, so a 50-track job is silent for as long as it takes to fetch 50 tracks.
# The read timeout has to outlast the service's own limit (ZIP_JOB_TIMEOUT_SECONDS,
# 1800 by default) with room to spare: matched exactly, nginx drops the silent
# connection at the same second the service is writing its 504 and the visitor
# sees a bare bad gateway instead of "the job took too long".
# Buffering would spool a multi-hundred-megabyte archive into nginx's temp path
# on top of the one the service already wrote.
location /api/public/zip {
    limit_req zone=cloudmp3_api burst=40 nodelay;
    limit_conn cloudmp3_conn 24;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 2100s;
    proxy_read_timeout 2100s;
    send_timeout 600s;
    tcp_nodelay on;
}

# Preview player: needs Range requests to survive untouched, so no buffering and
# no response rewriting. Range and If-Range are ordinary request headers and are
# forwarded as-is; re-declaring them with proxy_set_header would drop the
# inherited block above (nginx does not merge), so they are left alone.
location /api/public/preview {
    limit_req zone=cloudmp3_api burst=40 nodelay;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
}

# Everything else under /api/ (formats, server functions, downloads).
location /api/ {
    limit_req zone=cloudmp3_api burst=40 nodelay;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# SSR pages and TanStack server functions. Proxied directly rather than through
# try_files: the document root is a directory, and a "$uri" hit on "/" would be
# resolved as a directory listing attempt (403) instead of reaching the app.
#
# No HTML Cache-Control is set by the app, so Cloudflare leaves HTML alone. Do not
# add a "Cache Everything" page rule: /api/ responses are per-user work and
# robots.txt / sitemap.xml must reflect the deployed origin.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Fallback for an icon path that is not on disk — let the app answer instead of nginx's 404.
location @cloudmp3_app {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
