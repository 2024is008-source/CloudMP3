# Security response headers for cloudmp3.site.
#
# Install at /etc/nginx/snippets/cloudmp3-headers.conf.
#
# This is a file rather than four lines in the vhost because of how nginx treats
# `add_header`: a location that declares any header of its own stops inheriting
# the headers set above it. The static locations need a Cache-Control, so without
# including this snippet there they would answer with no security headers at all.
# Include it once at server level and again in every location that adds a header.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS is deliberately OFF until the site is live. Once a visitor's browser has
# cached the policy it cannot be withdrawn from that machine, so enabling it before
# HTTPS is proven end to end can lock everyone out of a domain you still need to fix.
#
# The app does not set this header (vite.config.ts declares only the four above, so
# the two layers cannot disagree and the value lives in exactly one place: here).
#
# Turn it on by uncommenting the line below once ALL of these hold on the real domain:
#   1. https://cloudmp3.site and https://www.cloudmp3.site both serve over TLS, with a
#      certificate that is not a Cloudflare origin certificate served to a bare IP.
#   2. Cloudflare's SSL mode is "Full (strict)" — not "Flexible", which would send the
#      origin plain HTTP and make a cached HSTS policy unrecoverable from the browser.
#   3. `curl -sI https://cloudmp3.site` shows the 301 from HTTP and a 200 over HTTPS.
#   4. No subdomain of cloudmp3.site is planned as an HTTP-only host — includeSubDomains
#      applies the policy to every one of them.
# max-age is 180 days (15552000s): long enough to be worth checking, short enough that a
# mistake ages out in months rather than the two years a preload submission would need.
# add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
